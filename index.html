<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Finanças Nuvem</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; margin-top: 0; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-google { background-color: #4285F4; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background-color: #357ae8; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-success { background-color: #2ecc71; color: white; }
        .card-user { display: flex; align-items: center; justify-content: space-between; background: #eef2f5; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; }
        .card-user img { border-radius: 50%; width: 40px; height: 40px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .transacao-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
        .transacao-item.receita { border-left: 5px solid #2ecc71; }
        .transacao-item.despesa { border-left: 5px solid #e74c3c; }
        .hidden { display: none !important; }
        .total-box { font-size: 20px; font-weight: bold; text-align: center; margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>💰 Minhas Finanças</h1>

    <!-- Tela de Login -->
    <div id="login-screen">
        <p style="text-align: center; color: #666;">Faça login para sincronizar seus dados em tempo real entre o PC e o Celular.</p>
        <button class="btn btn-google" onclick="loginGoogle()">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Entrar com o Google
        </button>
    </div>

    <!-- Conteúdo do App (Visível após Logar) -->
    <div id="app-screen" class="hidden">
        <div class="card-user">
            <div>
                <strong id="user-name">Usuário</strong><br>
                <small id="user-email" style="color: #666;"></small>
            </div>
            <button class="btn btn-danger" onclick="logout()" style="width: auto; margin:0; padding: 6px 12px; font-size: 13px;">Sair</button>
        </div>

        <div class="total-box">
            Saldo Atual: <span id="saldo-total">R$ 0,00</span>
        </div>

        <!-- Formulário de Novo Lançamento -->
        <h2>Novo Lançamento</h2>
        <form id="finance-form">
            <div class="input-group">
                <label>Descrição</label>
                <input type="text" id="desc" placeholder="Ex: Supermercado, Salário" required>
            </div>
            <div class="input-group">
                <label>Valor (R$)</label>
                <input type="number" id="valor" step="0.01" placeholder="0.00" required>
            </div>
            <div class="input-group">
                <label>Tipo</label>
                <select id="tipo">
                    <option value="receita">Receita (+)</option>
                    <option value="despesa">Despesa (-)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Adicionar à Nuvem</button>
        </form>

        <h2>Histórico (Sincronizado)</h2>
        <div id="lista-transacoes"></div>
    </div>
</div>

<script>
    // Suas Chaves de Conexão do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAACom-B7m3usJCbL3AtLnH1-2MaXYy8r0",
      authDomain: "minhas-financas-17a62.firebaseapp.com",
      projectId: "minhas-financas-17a62",
      storageBucket: "minhas-financas-17a62.firebasestorage.app",
      messagingSenderId: "601143286070",
      appId: "1:601143286070:web:899821540f121375a7bb97"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    // Monitorar estado do Login
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-name').innerText = user.displayName;
            document.getElementById('user-email').innerText = user.email;
            ouvirDadosEmTempoReal();
        } else {
            currentUser = null;
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }
    });

    // Login com Google
    function loginGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(error => alert("Erro ao logar: " + error.message));
    }

    // Logout
    function logout() {
        auth.signOut();
    }

    // Salvar no Firebase
    document.getElementById('finance-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const desc = document.getElementById('desc').value;
        const valor = parseFloat(document.getElementById('valor').value);
        const tipo = document.getElementById('tipo').value;

        db.collection("financas").doc(currentUser.uid).collection("lancamentos").add({
            desc: desc,
            valor: valor,
            tipo: tipo,
            criadoEm: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            document.getElementById('finance-form').reset();
        });
    });

    // Ouvir alterações em Tempo Real (Sincronização instantânea)
    function ouvirDadosEmTempoReal() {
        db.collection("financas").doc(currentUser.uid).collection("lancamentos")
          .orderBy("criadoEm", "desc")
          .onSnapshot(snapshot => {
              const lista = document.getElementById('lista-transacoes');
              lista.innerHTML = '';
              let saldo = 0;

              snapshot.forEach(doc => {
                  const item = doc.data();
                  if(item.tipo === 'receita') saldo += item.valor;
                  else saldo -= item.valor;

                  const div = document.createElement('div');
                  div.className = `transacao-item ${item.tipo}`;
                  div.innerHTML = `
                      <div>
                          <strong>${item.desc}</strong>
                      </div>
                      <div>
                          <strong style="color: ${item.tipo === 'receita' ? '#2ecc71' : '#e74c3c'}">
                              ${item.tipo === 'receita' ? '+' : '-'} R$ ${item.valor.toFixed(2)}
                          </strong>
                          <button onclick="deletar('${doc.id}')" style="background:none; border:none; color:#ccc; cursor:pointer; margin-left:10px;">❌</button>
                      </div>
                  `;
                  lista.appendChild(div);
              });

              document.getElementById('saldo-total').innerText = `R$ ${saldo.toFixed(2)}`;
              document.getElementById('saldo-total').style.color = saldo >= 0 ? '#2ecc71' : '#e74c3c';
          });
    }

    // Deletar lançamento
    function deletar(id) {
        db.collection("financas").doc(currentUser.uid).collection("lancamentos").doc(id).delete();
    }
</script>
</body>
</html>
